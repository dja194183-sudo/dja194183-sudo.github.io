<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AL Khatoon</title>
<style>
body{margin:0;background:#07080c;color:#e8edf5;font-family:system-ui}
.app{max-width:480px;margin:auto;padding:12px 12px 96px}
header{display:flex;justify-content:space-between}
h1{margin:0;font-size:18px}h3{margin:0 0 8px;font-size:14px}
.hint{color:#8b95a8;font-size:12px}
.ok{color:#3dd68c}.bad{color:#f5c542}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
input,select,button,textarea{background:#161b24;color:#e8edf5;border:1px solid #242b38;border-radius:12px;padding:10px;font-size:13px}
input,select,textarea{flex:1}.pri{background:#1c2740;color:#6ea8ff;font-weight:700}
.pairs,.tfs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.pairs{max-height:70px;overflow:auto}
.card{background:#10131a;border:1px solid #242b38;border-radius:16px;padding:14px;margin:0 0 10px}
.px{font-size:28px;font-weight:800}.sig{text-align:center}
.LONG{color:#3dd68c}.SHORT{color:#ff5d6c}.WAIT{color:#f5c542}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:#161b24;border-radius:12px;padding:10px}.kv span{display:block;color:#8b95a8;font-size:11px}
.item{padding:10px 0;border-bottom:1px solid #242b38;font-size:13px}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 6px 12px;background:#07080cf5;border-top:1px solid #242b38}
.dock button{min-height:46px;font-weight:700;font-size:11px}.hide{display:none}
.sub{display:flex;gap:6px;margin-bottom:8px}.sub button{flex:1}
</style></head><body>
<div class="app">
<header><div><h1>AL Khatoon</h1><div class="hint" id="meta">V1.9</div></div><div id="live" class="bad">connecting</div></header>
<div class="row"><input id="q" placeholder="جستجوی ارز"><select id="mkt"><option value="futures">Futures</option><option value="spot">Spot</option></select></div>
<div class="pairs" id="pairs"></div><div class="tfs" id="tfs"></div>
<section id="t-signal">
<div class="card"><div class="px" id="price">—</div><div class="hint" id="chg"></div></div>
<div class="card sig"><div id="dir" class="WAIT" style="font-size:32px;font-weight:800">WAIT</div><div id="score" class="WAIT" style="font-size:40px">0%</div>
<div class="hint" id="grade"></div>
<div class="row"><button class="pri" id="save">ثبت لحظه‌ای</button><button id="paper">Open paper</button></div>
<div class="hint" id="saved"></div></div>
<div class="card grid"><div class="kv"><span>Entry</span><b id="entry">—</b></div><div class="kv"><span>SL</span><b id="sl">—</b></div><div class="kv"><span>TP1</span><b id="tp">—</b></div><div class="kv"><span>RR</span><b>1.5</b></div></div>
<p class="hint" id="why">Paper only</p></section>
<section id="t-scan" class="hide card"></section>
<section id="t-journal" class="hide">
<div class="card"><h3>ژورنال</h3><div class="hint" id="jstats"></div><div id="jlist"></div></div>
<div class="card hide" id="editbox"><h3>ویرایش سفارش</h3>
<input id="e-sym" placeholder="نماد">
<div class="row"><select id="e-side"><option>LONG</option><option>SHORT</option></select><select id="e-res"><option>OPEN</option><option>WIN</option><option>LOSS</option><option>BE</option></select></div>
<div class="row"><input id="e-px" type="number" placeholder="ورود"><input id="e-sl" type="number" placeholder="SL"></div>
<div class="row"><input id="e-tp" type="number" placeholder="TP"><input id="e-exit" type="number" placeholder="خروج"></div>
<textarea id="e-note" rows="2" placeholder="یادداشت"></textarea>
<div class="row"><button class="pri" id="e-save">ذخیره ویرایش</button><button id="e-del">حذف</button></div></div>
</section>
<section id="t-desk" class="hide">
<div class="sub"><button class="pri" data-d="cap">سرمایه</button><button data-d="risk">ریسک</button><button data-d="chat">چت</button><button data-d="learn">آموزش</button></div>
<div id="d-cap" class="card"><h3>مدیریت سرمایه</h3>
<div class="row"><input id="c-eq" type="number" placeholder="equity"><input id="c-risk" type="number" placeholder="risk %"></div>
<div class="row"><input id="c-day" type="number" placeholder="daily %"><input id="c-open" type="number" placeholder="max open"></div>
<button class="pri" id="c-save">ذخیره قوانین</button>
<div class="grid" style="margin-top:8px"><div class="kv"><span>Equity</span><b id="c-show">1000</b></div><div class="kv"><span>ریسک</span><b id="c-rshow">0.4%</b></div></div></div>
<div id="d-risk" class="card hide"><h3>ریسک</h3><div class="hint" id="r-out">اول سیگنال</div></div>
<div id="d-chat" class="card hide"><h3>چت</h3><div id="thread" class="hint">ریسک، ورود، ژورنال</div><div class="row"><input id="chat-in" placeholder="پیام"><button class="pri" id="chat-go">ارسال</button></div></div>
<div id="d-learn" class="card hide"><h3>آموزش روزانه</h3><p id="tip"></p></div>
</section>
<section id="t-more" class="hide card"><p>V1.9 عمومی. سفارش واقعی ندارد.</p><p class="hint" id="paperbox"></p></section>
</div>
<nav class="dock">
<button class="pri" data-t="signal">سیگنال</button>
<button data-t="scan">بازار</button>
<button data-t="journal">ژورنال</button>
<button data-t="desk">میز</button>
<button data-t="more">بیشتر</button>
</nav>
<script src="./app.js?v=19"></script></body></html>
